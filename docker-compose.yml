networks:
  esg_network:
    driver: bridge

volumes:
  mongo_data_prod:
  mongo_data_staging:

services:
  # ------------------------- AMBIENTE DE STAGING -------------------------
  mongodb-staging:
    image: mongo:6.0
    container_name: ecocity-mongodb-staging
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_STAGING_PASSWORD:-stagingpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ecocity_esg}
    volumes:
      - mongo_data_staging:/data/db
    networks:
      - esg_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecocity-api-staging
    restart: always
    depends_on:
      mongodb-staging:
        condition: service_healthy
    ports:
      - "${STAGING_PORT:-8081}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_STAGING_PASSWORD:-stagingpassword}@mongodb-staging:27017/${MONGO_DATABASE:-ecocity_esg}?authSource=admin
    networks:
      - esg_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ------------------------ AMBIENTE DE PRODUÇÃO -------------------------
  mongodb-prod:
    image: mongo:6.0
    container_name: ecocity-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PROD_PASSWORD:-prodpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ecocity_esg}
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - esg_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecocity-api-prod
    restart: always
    depends_on:
      mongodb-prod:
        condition: service_healthy
    ports:
      - "${PROD_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_PROD_PASSWORD:-prodpassword}@mongodb-prod:27017/${MONGO_DATABASE:-ecocity_esg}?authSource=admin
    networks:
      - esg_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
